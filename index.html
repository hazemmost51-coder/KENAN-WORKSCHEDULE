<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة الفرق والمعدات</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
</head>
<body>

    <section id="login-page" class="page active">
        <div class="login-container">
            <div class="brand">
                <div class="icon-box"><img src="pic/logo.png" width="250" height="250" alt=" الشعار "></div>
                <h1>دخول نظام ادارة الفرق والمعدات</h1>
            </div>
            <div class="input-field"><input type="text" id="login-user" placeholder="اسم المستخدم"></div>
            <div class="input-field"><input type="password" id="login-pass" placeholder="كلمة المرور"></div>
            <button class="btn-primary" onclick="Login()">دخول</button>
        </div>
    </section>

    <section id="work-order-page" class="page">
    <div class="login-container">
        <div class="brand">
            <h1 id="order-title">بيانات أمر العمل</h1>
        </div>
        
        <div class="input-field">
            <input type="text" id="order-number" placeholder="رقم أمر العمل">
        </div>

        <div class="input-field">
            <select id="order-site">
                <option value="" disabled selected>اختر الموقع</option>
                </select>
        </div>

        <div class="input-field">
            <select id="order-consultant">
                <option value="" disabled selected>اختر اسم الاستشاري</option>
                </select>
        </div>
        <div class="input-field">
            <select id="order-type">
                <option value="" disabled selected>اختر نوع العمل </option>
                </select>
        </div>
        <div class="input-field">
            <select id="order-description">
                <option value="" disabled selected>اختر وصف العمل </option>
                </select>
        </div>

        <div class="input-field">
            <input type="text" id="order-coords" placeholder="الإحداثيات">
        </div>
        
        <button class="btn-primary" onclick="startWorkOrder()">متابعة لاختيار المهندس</button>
        <button class="btn-danger-all" onclick="resetAllData()">مسح كافة البيانات والبدء من جديد</button>
        <button class="btn-back" onclick="goToPage('engineers-page')">العودة للوحة التحكم</button>
    </div>
</section>

    <section id="engineers-page" class="page">
        <div class="main-layout">
            <div class="engineers-column">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2>👤 المهندسون</h2>
                    <button class="btn-add-order" onclick="prepareNewOrder()">+ أمر عمل جديد</button>
                </div>
                <div id="engineers-list-container"></div>
                
                <div class="orders-history" style="margin-top: 30px;">
                    <h2>📂 سجل أوامر العمل (اضغط للتعديل)</h2>
                    <div id="orders-list-display"></div>
                </div>

                <button class="btn-primary" onclick="exportToExcel()" style="background: #10b981; margin-top: 20px;">تصدير Excel</button>
                <button class="btn-danger-all" onclick="resetAllData()">مسح كافة بيانات الموقع والبدء من جديد</button>
            </div>
            <div class="inventory-column">
                <div class="inventory-card">
                    <h3>📦 المتاح حالياً</h3>
                    <div id="available-pool"></div>
                </div>
            </div>
        </div>
    </section>

    <section id="assets-page" class="page">
        <div class="selection-layout">
            <div class="categories-panel">
                <h3>تخصيص لـ: <span id="active-eng"></span></h3>
                <div id="playlists-container"></div>
            </div>
            <div class="summary-panel">
                <h2>المعدات المختارة</h2>
                <div id="selected-items-list"></div>
                <button class="btn-save" onclick="confirmSelection()">حفظ التعديلات</button>
                <button class="btn-back" onclick="goToPage('engineers-page')">رجوع</button>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
